{{define "note_form"}}<form id="note-form" action="/notes" method="post" hx-post="/notes" hx-target="#notes-list" hx-swap="afterbegin">
{{template "flash" .}}
<div>
<label for="note-title">Title</label>
<input id="note-title" name="title" type="text" required autocomplete="off" value="{{.Title}}"{{if .TitleError}} aria-invalid="true" aria-describedby="note-title-error"{{end}}>
{{if .TitleError}}<p class="field-error" id="note-title-error" role="alert">{{.TitleError}}</p>{{end}}
</div>
<div>
<label for="note-body">Body</label>
<textarea id="note-body" name="body" rows="3">{{.Body}}</textarea>
</div>
<button type="submit">Add note</button>
</form>{{end}}
