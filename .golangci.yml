version: "2"

linters:
  enable:
    - bodyclose
    - errcheck
    - gosec
    - copyloopvar
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usetesting

  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: package-comments
        - name: exported
          arguments: ["disableStutteringCheck"]

  exclusions:
    rules:
      # The status line is already on the wire, so the only error Encode can
      # return is the client having hung up.
      - linters: [errcheck]
        source: "json.NewEncoder\\(w\\).Encode"
      # Test helpers assert rather than return, and a test client talking to a
      # server it started itself needs neither a context nor a body close.
      - linters: [errcheck, gosec, noctx, bodyclose]
        path: _test\.go

formatters:
  enable:
    - gofmt
