name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -count=1 ./...

      # The same suite again with a missing Docker turned into a failure. A
      # database-backed test that skips itself is indistinguishable from one
      # that passes, and the runner has Docker, so there is nothing to skip.
      - name: Database-backed tests
        env:
          KEEL_REQUIRE_DB: "1"
        run: go test -count=1 ./pg/... ./examples/... ./auth/pg/... ./admin/pg/... ./app/...

      # Its own step, so a migration that does not replay is reported as that
      # rather than as one failure among a package's worth. ARCHITECTURE.md
      # presents Replay as a guarantee of this repository; this is what makes
      # it one.
      - name: Migrations replay
        env:
          KEEL_REQUIRE_DB: "1"
        run: go test -count=1 -run 'TestRepositoryMigrations|TestDiscoverMigrationDirs' -v ./pg/migrate/

  # The database-backed suite once per supported Postgres major. The harness
  # reads the major from KEEL_TESTDB_PG_VERSION, so this is the check that
  # version-specific behavior (collation, text search configs, advisory lock
  # semantics) holds on every server the tests claim to cover. The range is
  # the default major plus one on each side; widening it is a one-line change.
  pg-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Database-backed tests on Postgres ${{ matrix.pg }}
        env:
          KEEL_REQUIRE_DB: "1"
          KEEL_TESTDB_PG_VERSION: ${{ matrix.pg }}
        run: go test -count=1 ./pg/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned to the earliest release whose binary was itself built with
          # a go1.26 toolchain (checked directly: `go version` on the
          # released binary reports go1.25.5 for v2.8.0 and go1.26.0 for
          # v2.9.0) — golangci-lint refuses to analyze a module whose go.mod
          # targets a newer Go version than the linter binary was compiled
          # with, and go.mod here now requires go 1.26.0.
          version: v2.9.0
      # A build artifact in the tree is the usual cause, and the tree is the last
      # place anyone looks. Cheap to check, and it catches any binary rather
      # than the one name an ignore rule happens to list.
      - name: No large files committed
        run: |
          large=$(git ls-files | while read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt 1048576 ]; then printf '%s\t%s\n' "$size" "$f"; fi
          done)
          if [ -n "$large" ]; then
            echo "committed files over 1 MiB:"
            echo "$large"
            echo
            echo "'go build ./...' writes a main package's binary into the working directory."
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, and a shallow clone silently scans almost
          # none of it — the job would pass by having nothing to look at.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Pinned so every run scans with the same rules. Installed from source
      # through the module proxy, so the build is checksum-verified.
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # Always the full history, never the push's base..head range. The
      # gitleaks action derives that range from the push payload, and after a
      # force-push the range does not resolve (its base is the new root, which
      # has no parent): gitleaks then scans zero bytes and fails the job. A
      # full scan has no range to resolve, fails on leaks, and fails when the
      # scan itself errors, so the gate stays closed in every failure mode.
      - name: Scan full history
        run: |
          # A scan of an empty clone reports no leaks and exits 0. The
          # checkout above always provides history; refuse to pass without it.
          test "$(git rev-list --count HEAD)" -gt 0
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code=1

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: check-deployed-revision.sh self-test
        run: scripts/check-deployed-revision.sh --self-test
      - name: verify-deployed.sh self-test
        run: scripts/verify-deployed.sh --self-test
      - name: deploy-cloudbuild.sh self-test
        run: scripts/deploy-cloudbuild.sh --self-test
      - name: docker compose config validates
        run: docker compose -f deploy/compose.yaml config >/dev/null
      # Builds deploy/Dockerfile against a throwaway project, not keel
      # itself — keel's only main package outside the example is cmd/keel, a
      # scaffolding CLI rather than a service. See the
      # script's own header for exactly what this does and does not prove.
      - name: Dockerfile self-test
        run: scripts/test-dockerfile.sh
